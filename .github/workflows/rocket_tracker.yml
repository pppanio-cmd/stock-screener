name: Rocket Trade Tracker
on:
  schedule:
    - cron: '30 23 * * 1-5' # Запуск в 23:30 UTC (чуть позже основного бота)
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl yfinance

      - name: Run Rocket Scanner
        run: python rocket_scanner.py

      - name: Run Rocket Tracker
        run: python rocket_tracker.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update rocket journal" || echo "No changes"
          git push origin main --force

      - name: Send to Telegram
        run: |
          if [ -f rocket_summary.txt ]; then
            SUMMARY=$(cat rocket_summary.txt)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$SUMMARY"
          fi
