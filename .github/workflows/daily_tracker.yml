name: Daily Trade Tracker
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl yfinance

      - name: Run Tracker
        run: python tracker_cloud.py

      - name: Commit and Push updated Excel
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git add -f summary.txt
          git commit -m "Auto-update trade journal" || echo "No changes"
          git push origin main --force

      - name: Send Excel to Telegram
        run: |
          if [ -f summary.txt ]; then
            SUMMARY=$(cat summary.txt)
            echo "========================================"
            echo "ТЕКСТ ДЛЯ ОТПРАВКИ: $SUMMARY"
            echo "========================================"
            
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="💰 Ваш портфель: $SUMMARY")
            
            echo "ОТВЕТ ОТ TELEGRAM:"
            echo "$RESPONSE"
          else
            echo "❌ ОШИБКА: Файл summary.txt не был создан скриптом tracker_cloud.py"
          fi
