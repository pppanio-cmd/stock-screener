name: Daily Trade Tracker
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl yfinance

      - name: Run Tracker
        run: python tracker_cloud.py

      - name: Commit and Push updated Excel
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add trading_journal.xlsx summary.txt
          git commit -m "Auto-update trade journal" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Send Excel to Telegram
        run: |
          SUMMARY=$(cat summary.txt)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="💰 Ваш портфель: $SUMMARY"
