name: Daily Trade Tracker
on:
  schedule:
    - cron: '0 23 * * 1-5' # Запуск каждый день в 23:00 UTC (после закрытия рынка США)
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl yfinance

      - name: Run Tracker
        run: python tracker_cloud.py

      - name: Commit and Push updated Excel
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add trading_journal.xlsx
          git diff --staged --quiet || git commit -m "Auto-update trade journal"
          git push

      - name: Send Excel to Telegram
        run: |
          echo "1. Проверяем наличие файла:"
          ls -la trading_journal.xlsx
          
          echo "2. Отправляем запрос в Telegram API (тест с фейковым ID):"
          curl -v -X POST "https://api.telegram.org/bot8539392402:AAEwtlYVrRWM8tY1JdDiHSm27uTY_tba9IA/sendDocument" \
          -F chat_id="123456789" \
          -F document=@"trading_journal.xlsx" \
          -F caption="📊 Тест отправки"
